<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGP Encryption - Saved Keys</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Menu Button */
        .menu-btn {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 1001;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .menu-btn:hover { background: rgba(157,78,221,0.3); border-color: #9d4edd; }
        .menu-btn span {
            display: block;
            width: 24px; height: 2px;
            background: #fff;
            margin: 5px 0;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .menu-btn.active span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
        .menu-btn.active span:nth-child(2) { opacity: 0; }
        .menu-btn.active span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

        /* Sidebar */
        .sidebar {
            position: fixed; top: 0; left: 0;
            width: 350px; height: 100vh;
            background: rgba(22,33,62,0.98);
            border-right: 1px solid rgba(157,78,221,0.3);
            padding: 80px 30px 30px 30px;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar h2 {
            color: #9d4edd;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(157,78,221,0.3);
        }
        .tab-btn {
            flex: 1; padding: 12px;
            background: none; border: none;
            color: #c77dff;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: #9d4edd; border-bottom-color: #9d4edd; }
        .tab-btn:hover { color: #9d4edd; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block; color: #c77dff;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%; padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(157,78,221,0.3);
            border-radius: 8px;
            color: #fff; font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #9d4edd;
            background: rgba(157,78,221,0.1);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }
        .form-group textarea {
            width: 100%; padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(157,78,221,0.3);
            border-radius: 8px;
            color: #fff; font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: all 0.3s ease;
            resize: vertical;
            min-height: 100px;
        }
        .form-group textarea:focus {
            border-color: #9d4edd;
            background: rgba(157,78,221,0.1);
        }
        .form-group textarea::placeholder { color: rgba(255,255,255,0.3); }
        .submit-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(90deg, #7b2cbf, #9d4edd);
            border: none; border-radius: 8px;
            color: #fff; font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            background: linear-gradient(90deg, #9d4edd, #c77dff);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(157,78,221,0.4);
        }
        .message {
            margin-top: 1rem; padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }
        .message.success { display: block; background: rgba(76,175,80,0.2); color: #81c784; border: 1px solid rgba(76,175,80,0.3); }
        .message.error { display: block; background: rgba(244,67,54,0.2); color: #e57373; border: 1px solid rgba(244,67,54,0.3); }

        .user-info {
            text-align: center;
            padding: 20px;
            background: rgba(157,78,221,0.1);
            border-radius: 12px;
            border: 1px solid rgba(157,78,221,0.3);
        }
        .user-info h3 { color: #9d4edd; margin-bottom: 0.5rem; }
        .user-info p { color: #c77dff; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .logout-btn {
            background: rgba(244,67,54,0.2);
            border: 1px solid rgba(244,67,54,0.4);
            color: #e57373;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .logout-btn:hover { background: rgba(244,67,54,0.3); }

        /* Sidebar Nav */
        .sidebar-nav {
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .sidebar-nav a {
            padding: 12px 16px;
            background: rgba(157,78,221,0.1);
            border: 1px solid rgba(157,78,221,0.25);
            border-radius: 8px;
            color: #c77dff;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .sidebar-nav a:hover {
            background: rgba(157,78,221,0.25);
            border-color: #9d4edd;
            color: #fff;
        }
        .sidebar-nav a.active {
            background: linear-gradient(90deg, #7b2cbf, #9d4edd);
            border-color: #9d4edd;
            color: #fff;
        }

        /* Main Content */
        .main-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .page-header {
            text-align: center;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #9d4edd;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .page-header .subtitle {
            margin-top: 0.5rem;
            font-size: 1rem;
            color: #c77dff;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .nav-tabs {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .nav-tab {
            padding: 12px 32px;
            background: rgba(157,78,221,0.15);
            border: 1px solid rgba(157,78,221,0.4);
            border-radius: 10px;
            color: #c77dff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .nav-tab:hover {
            background: rgba(157,78,221,0.3);
            border-color: #9d4edd;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(157,78,221,0.3);
        }
        .nav-tab.active {
            background: linear-gradient(90deg, #7b2cbf, #9d4edd);
            border-color: #9d4edd;
            color: #fff;
        }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #9d4edd;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 .icon { font-size: 1.5rem; }

        /* Saved Keys List */
        .saved-key-item {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(157,78,221,0.25);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .saved-key-item:hover {
            border-color: rgba(157,78,221,0.5);
            box-shadow: 0 4px 15px rgba(157,78,221,0.15);
        }
        .saved-key-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .saved-key-name {
            color: #9d4edd;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .saved-key-actions {
            display: flex;
            gap: 0.5rem;
        }
        .key-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .key-btn-copy {
            background: rgba(76,175,80,0.15);
            border: 1px solid rgba(76,175,80,0.3);
            color: #81c784;
        }
        .key-btn-copy:hover { background: rgba(76,175,80,0.25); }
        .key-btn-edit {
            background: rgba(33,150,243,0.15);
            border: 1px solid rgba(33,150,243,0.3);
            color: #64b5f6;
        }
        .key-btn-edit:hover { background: rgba(33,150,243,0.25); }
        .key-btn-delete {
            background: rgba(244,67,54,0.15);
            border: 1px solid rgba(244,67,54,0.3);
            color: #e57373;
        }
        .key-btn-delete:hover { background: rgba(244,67,54,0.25); }
        .saved-key-preview {
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            color: #c77dff;
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            padding: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 120px;
            overflow-y: auto;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: rgba(255,255,255,0.4);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(90deg, #7b2cbf, #9d4edd);
            color: #fff;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #9d4edd, #c77dff);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(157,78,221,0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(157,78,221,0.3);
            color: #c77dff;
        }
        .btn-secondary:hover {
            background: rgba(157,78,221,0.2);
            border-color: #9d4edd;
            color: #fff;
        }

        .status-msg {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }
        .status-msg.show { display: block; }
        .status-msg.ok { background: rgba(76,175,80,0.15); color: #81c784; border: 1px solid rgba(76,175,80,0.3); }
        .status-msg.error { background: rgba(244,67,54,0.15); color: #e57373; border: 1px solid rgba(244,67,54,0.3); }
        .status-msg.info { background: rgba(33,150,243,0.15); color: #64b5f6; border: 1px solid rgba(33,150,243,0.3); }

        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: rgba(22,33,62,0.98);
            border: 1px solid rgba(157,78,221,0.4);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            color: #9d4edd;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .modal-btns {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- Menu Button -->
    <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <span></span><span></span><span></span>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div id="authSection">
            <h2>Account</h2>
            <div class="tabs">
                <button class="tab-btn active" data-tab="register">Register</button>
                <button class="tab-btn" data-tab="login">Login</button>
            </div>
            <div class="tab-content active" id="register">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regUsername">Username</label>
                        <input type="text" id="regUsername" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" placeholder="Enter password" required minlength="6">
                    </div>
                    <button type="submit" class="submit-btn">Create Account</button>
                    <div class="message" id="regMessage"></div>
                </form>
            </div>
            <div class="tab-content" id="login">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                    <div class="message" id="loginMessage"></div>
                </form>
            </div>
        </div>

        <div class="user-info" id="userInfo" style="display: none;">
            <h3>Welcome!</h3>
            <p id="userName">User</p>
            <nav class="sidebar-nav" id="sidebarNav">
                <a href="/">Home</a>
                <a href="/encrypt.html">Encrypt / Decrypt</a>
                <a href="/profile.html">My Profile</a>
                <a href="/saved-keys.html" class="active">Saved Keys</a>
            </nav>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <h1>PGP Encryption</h1>
            <div class="subtitle">Saved Public Keys</div>
            <nav class="nav-tabs">
                <a href="/" class="nav-tab">Home</a>
                <a href="/encrypt.html" class="nav-tab">Encrypt / Decrypt</a>
                <a href="/profile.html" class="nav-tab">My Profile</a>
                <a href="/saved-keys.html" class="nav-tab active">Saved Keys</a>
            </nav>
        </div>

        <!-- Add New Key Card -->
        <div class="card" id="addKeyCard">
            <h2><span class="icon">➕</span> Add New Key</h2>
            <div class="form-group">
                <label for="keyName">Contact Name / Username</label>
                <input type="text" id="keyName" placeholder="e.g. alice, bob@example.com..." required>
            </div>
            <div class="form-group">
                <label for="keyPublicKey">Public Key</label>
                <textarea id="keyPublicKey" placeholder="Paste PGP public key block here..." required></textarea>
            </div>
            <div class="action-btns">
                <button class="btn btn-primary" id="saveKeyBtn">Save Key</button>
                <button class="btn btn-secondary" id="clearFormBtn">Clear</button>
            </div>
            <div class="status-msg" id="formStatus"></div>
        </div>

        <!-- Saved Keys List -->
        <div class="card">
            <h2><span class="icon">🔑</span> Your Saved Keys</h2>
            <div id="savedKeysList">
                <div class="empty-state">
                    <div class="icon">🔍</div>
                    <p>No saved keys yet. Add one above!</p>
                </div>
            </div>
            <div class="status-msg" id="listStatus"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>Edit Saved Key</h3>
            <input type="hidden" id="editKeyId">
            <div class="form-group">
                <label for="editKeyName">Contact Name / Username</label>
                <input type="text" id="editKeyName" required>
            </div>
            <div class="form-group">
                <label for="editKeyPublicKey">Public Key</label>
                <textarea id="editKeyPublicKey" required></textarea>
            </div>
            <div class="modal-btns">
                <button class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
                <button class="btn btn-primary" id="confirmEditBtn">Update Key</button>
            </div>
        </div>
    </div>

    <script>
        // Menu Toggle
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        function toggleMenu() {
            menuBtn.classList.toggle('active');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
        menuBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // Tab Switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        function showLoggedIn(username) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('userName').textContent = username;
        }
        function showLoggedOut() {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('userInfo').style.display = 'none';
        }
        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = 'message ' + (type === 'success' ? 'success' : 'error');
            setTimeout(() => { el.className = 'message'; el.textContent = ''; }, 4000);
        }
        function showStatus(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = 'status-msg show ' + type;
            setTimeout(() => { el.className = 'status-msg'; el.textContent = ''; }, 5000);
        }

        // Auth Forms
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('regUsername').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('regMessage', 'Account created! You can now log in.', 'success');
                    document.getElementById('registerForm').reset();
                    document.querySelector('[data-tab="login"]').click();
                } else {
                    showMessage('regMessage', data.error || 'Registration failed', 'error');
                }
            } catch (e) { showMessage('regMessage', 'Network error', 'error'); }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('loginUsername').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('loginMessage', 'Logged in successfully!', 'success');
                    showLoggedIn(data.username);
                    loadSavedKeys();
                } else {
                    showMessage('loginMessage', data.error || 'Login failed', 'error');
                }
            } catch (e) { showMessage('loginMessage', 'Network error', 'error'); }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/logout', { method: 'POST' });
                if (res.ok) {
                    showLoggedOut();
                    document.getElementById('savedKeysList').innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🔍</div>
                            <p>No saved keys yet. Add one above!</p>
                        </div>
                    `;
                }
            } catch (e) { console.error('Logout failed:', e); }
        });

        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                if (data.logged_in) {
                    showLoggedIn(data.username);
                    loadSavedKeys();
                }
            } catch (e) { console.error('Auth check failed:', e); }
        }

        // ==================== Saved Keys Logic ====================

        async function loadSavedKeys() {
            try {
                const res = await fetch('/api/saved-keys');
                if (res.status === 401) {
                    showStatus('listStatus', 'Please log in to view your saved keys.', 'info');
                    return;
                }
                const data = await res.json();
                if (res.ok) {
                    renderSavedKeys(data.keys);
                } else {
                    showStatus('listStatus', data.error || 'Failed to load saved keys', 'error');
                }
            } catch (e) {
                showStatus('listStatus', 'Network error loading saved keys', 'error');
            }
        }

        function renderSavedKeys(keys) {
            const container = document.getElementById('savedKeysList');
            if (!keys || keys.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <p>No saved keys yet. Add one above!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = keys.map(key => `
                <div class="saved-key-item" data-id="${key.id}">
                    <div class="saved-key-header">
                        <div class="saved-key-name">${escapeHtml(key.name)}</div>
                        <div class="saved-key-actions">
                            <button class="key-btn key-btn-copy" onclick="copyKey(${key.id})">Copy</button>
                            <button class="key-btn key-btn-edit" onclick="editKey(${key.id}, '${escapeHtml(key.name).replace(/'/g, "\\'")}', '${escapeHtml(key.public_key).replace(/'/g, "\\'")}')">Edit</button>
                            <button class="key-btn key-btn-delete" onclick="deleteKey(${key.id})">Delete</button>
                        </div>
                    </div>
                    <div class="saved-key-preview" id="keyPreview-${key.id}">${escapeHtml(key.public_key)}</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Save new key
        document.getElementById('saveKeyBtn').addEventListener('click', async () => {
            const name = document.getElementById('keyName').value.trim();
            const publicKey = document.getElementById('keyPublicKey').value.trim();

            if (!name) {
                showStatus('formStatus', 'Please enter a contact name.', 'error');
                return;
            }
            if (!publicKey) {
                showStatus('formStatus', 'Please paste a public key.', 'error');
                return;
            }

            try {
                const res = await fetch('/api/saved-keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, public_key: publicKey })
                });
                const data = await res.json();

                if (res.ok) {
                    showStatus('formStatus', 'Key saved successfully!', 'ok');
                    document.getElementById('keyName').value = '';
                    document.getElementById('keyPublicKey').value = '';
                    loadSavedKeys();
                } else if (res.status === 401) {
                    showStatus('formStatus', 'Please log in to save keys.', 'error');
                } else {
                    showStatus('formStatus', data.error || 'Failed to save key', 'error');
                }
            } catch (e) {
                showStatus('formStatus', 'Network error saving key', 'error');
            }
        });

        document.getElementById('clearFormBtn').addEventListener('click', () => {
            document.getElementById('keyName').value = '';
            document.getElementById('keyPublicKey').value = '';
        });

        // Copy key
        window.copyKey = function(id) {
            const keyText = document.getElementById(`keyPreview-${id}`).textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                showStatus('listStatus', 'Key copied to clipboard!', 'ok');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = keyText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showStatus('listStatus', 'Key copied to clipboard!', 'ok');
            });
        };

        // Edit key
        window.editKey = function(id, name, publicKey) {
            document.getElementById('editKeyId').value = id;
            document.getElementById('editKeyName').value = name;
            document.getElementById('editKeyPublicKey').value = publicKey;
            document.getElementById('editModal').classList.add('active');
        };

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            document.getElementById('editModal').classList.remove('active');
        });

        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('editModal')) {
                document.getElementById('editModal').classList.remove('active');
            }
        });

        document.getElementById('confirmEditBtn').addEventListener('click', async () => {
            const id = document.getElementById('editKeyId').value;
            const name = document.getElementById('editKeyName').value.trim();
            const publicKey = document.getElementById('editKeyPublicKey').value.trim();

            if (!name) {
                showStatus('listStatus', 'Name is required.', 'error');
                return;
            }
            if (!publicKey) {
                showStatus('listStatus', 'Public key is required.', 'error');
                return;
            }

            try {
                const res = await fetch(`/api/saved-keys/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, public_key: publicKey })
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('editModal').classList.remove('active');
                    showStatus('listStatus', 'Key updated successfully!', 'ok');
                    loadSavedKeys();
                } else if (res.status === 401) {
                    showStatus('listStatus', 'Please log in to edit keys.', 'error');
                } else {
                    showStatus('listStatus', data.error || 'Failed to update key', 'error');
                }
            } catch (e) {
                showStatus('listStatus', 'Network error updating key', 'error');
            }
        });

        // Delete key
        window.deleteKey = async function(id) {
            if (!confirm('Are you sure you want to delete this saved key?')) return;

            try {
                const res = await fetch(`/api/saved-keys/${id}`, { method: 'DELETE' });
                const data = await res.json();

                if (res.ok) {
                    showStatus('listStatus', 'Key deleted successfully!', 'ok');
                    loadSavedKeys();
                } else if (res.status === 401) {
                    showStatus('listStatus', 'Please log in to delete keys.', 'error');
                } else {
                    showStatus('listStatus', data.error || 'Failed to delete key', 'error');
                }
            } catch (e) {
                showStatus('listStatus', 'Network error deleting key', 'error');
            }
        };

        checkAuth();
    </script>
</body>
</html>

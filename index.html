        /* Menu Button */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: rgba(157, 78, 221, 0.3);
            border-color: #9d4edd;
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background: #fff;
            margin: 5px 0;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 350px;
            height: 100vh;
            background: rgba(22, 33, 62, 0.98);
            border-right: 1px solid rgba(157, 78, 221, 0.3);

            z-index: 1000;

            left: 0;

            z-index: 999;

            color: #81c784;
            border: 1px solid rgba(76, 175, 80, 0.3);

            background: rgba(244, 67, 54, 0.2);
            color: #e57373;
            border: 1px solid rgba(244, 67, 54, 0.3);

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
        }
        .toast {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #fff;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastSlideIn 0.35s ease;
            transform-origin: top right;
            cursor: default;
        }
        .toast.closing { animation: toastSlideOut 0.25s ease forwards; }
        .toast.success { background: rgba(46, 125, 50, 0.92); border: 1px solid rgba(76, 175, 80, 0.6); }
        .toast.error { background: rgba(183, 28, 28, 0.92); border: 1px solid rgba(244, 67, 54, 0.6); }
        .toast.info { background: rgba(21, 101, 192, 0.92); border: 1px solid rgba(33, 150, 243, 0.6); }
        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
        }
        .toast-close:hover { color: #fff; }
        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateX(100%) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes toastSlideOut {
            from { opacity: 1; transform: translateX(0) scale(1); }
            to { opacity: 0; transform: translateX(100%) scale(0.95); }
        }

        /* Shake animation for input errors */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s ease; }
        .input-error {
            border-color: #f44336 !important;
            background: rgba(244, 67, 54, 0.08) !important;
        }

        /* Button loading */
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;

            margin-right: 8px;
            vertical-align: middle;

            border: 1px solid rgba(157, 78, 221, 0.3);

        <div class="right-tabs">
            <button class="right-tab-btn active" data-right-tab="notes">&#9998; Notes</button>
            <button class="right-tab-btn" data-right-tab="savedKeysList">&#128273; Saved Keys</button>
        </div>

        <div class="right-tab-content active" id="notes">
            <div class="notes-toolbar">
                <h3>&#128221; My Notes</h3>
                <button class="btn-sm" id="newNoteBtn">+ New</button>
            </div>
            <ul class="notes-list" id="notesList">
                <li class="notes-empty">Log in to create and save notes.</li>
            </ul>
            <input type="text" class="note-title-input" id="noteTitleInput" placeholder="Note title..." disabled>
            <textarea class="notes-textarea" id="notesTextarea" placeholder="Select or create a note to start writing..." disabled></textarea>
            <div class="notes-status" id="notesStatus"></div>
        </div>

        <div class="right-tab-content" id="savedKeysList">
            <ul class="saved-keys-list" id="savedKeysListItems">
                <li class="saved-keys-empty">Log in to see your saved keys.</li>
            </ul>
        </div>
    </aside>

<!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Menu Toggle
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            menuBtn.classList.toggle('active');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        menuBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // Tab Switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        // ================= Toast Notifications =================
        function showToast(text, type = 'info', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            const icon = type === 'success' ? '&#10003;' : type === 'error' ? '&#10007;' : '&#9432;';
            toast.innerHTML = `<span>${icon}</span><span style="flex:1">${escapeHtml(text)}</span><button class="toast-close">&times;</button>`;
            container.appendChild(toast);

            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => removeToast(toast));

            if (duration > 0) {
                setTimeout(() => removeToast(toast), duration);
            }
        }

        function removeToast(toast) {
            if (!toast.parentNode) return;
            toast.classList.add('closing');
            setTimeout(() => toast.remove(), 300);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ================= Field Validation =================
        function clearFieldError(input) {
            input.classList.remove('input-error', 'shake');
        }

        function setFieldError(input) {
            input.classList.add('input-error', 'shake');
            setTimeout(() => input.classList.remove('shake'), 400);
        }

        function validateUsername(input) {
            clearFieldError(input);
            const val = input.value.trim();
            if (!val) {
                setFieldError(input);
                return 'Username is required.';
            }
            if (val.length < 3) {
                setFieldError(input);
                return 'Username must be at least 3 characters.';
            }
            if (!/^[a-zA-Z0-9_-]+$/.test(val)) {
                setFieldError(input);
                return 'Username can only contain letters, numbers, underscores, and hyphens.';
            }
            return '';
        }

        function validatePassword(input) {
            clearFieldError(input);
            const val = input.value;
            if (!val) {
                setFieldError(input);
                return 'Password is required.';
            }
            if (val.length < 6) {
                setFieldError(input);
                return 'Password must be at least 6 characters.';
            }
            return '';
        }

        // ================= Button Loading =================
        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = '<span class="spinner"></span>Please wait...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.originalText || btn.innerHTML.replace('<span class="spinner"></span>Please wait...', '');
            }
        }

        // ================= Auth UI =================
        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                if (data.logged_in) {
                    showLoggedIn(data.username);
                }
            } catch (e) {
                console.error('Auth check failed:', e);
            }
        }

        function showLoggedIn(username) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('userName').textContent = username;
        }

        function showLoggedOut() {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('userInfo').style.display = 'none';
        }

        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = 'message ' + (type === 'success' ? 'success' : 'error');
            setTimeout(() => {
                el.className = 'message';
                el.textContent = '';
            }, 4000);
        }

        // ================= Register =================
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('regUsername');
            const passwordInput = document.getElementById('regPassword');
            const btn = e.submitter || e.target.querySelector('.submit-btn');

            const uErr = validateUsername(usernameInput);
            if (uErr) { showToast(uErr, 'error'); return; }
            const pErr = validatePassword(passwordInput);
            if (pErr) { showToast(pErr, 'error'); return; }

            setLoading(btn, true);
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput.value.trim(), password: passwordInput.value })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Account created successfully! You can now log in.', 'success', 5000);
                    document.getElementById('registerForm').reset();
                    document.querySelector('[data-tab="login"]').click();
                } else if (res.status === 409) {
                    setFieldError(usernameInput);
                    showToast(data.error || 'That username is already taken.', 'error');
                } else if (res.status === 400) {
                    showToast(data.error || 'Invalid registration details.', 'error');
                } else {
                    showToast(data.error || 'Registration failed. Please try again.', 'error');
                }
            } catch (err) {
                showToast('Network error: unable to reach the server. Please check your connection.', 'error');
            } finally {
                setLoading(btn, false);
            }
        });

        // Clear field errors on input
        document.getElementById('regUsername').addEventListener('input', function() { clearFieldError(this); });
        document.getElementById('regPassword').addEventListener('input', function() { clearFieldError(this); });

        // ================= Login =================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            const btn = e.submitter || e.target.querySelector('.submit-btn');

            const uErr = validateUsername(usernameInput);
            if (uErr) { showToast(uErr, 'error'); return; }
            const pErr = validatePassword(passwordInput);
            if (pErr) { showToast(pErr, 'error'); return; }

            setLoading(btn, true);
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput.value.trim(), password: passwordInput.value })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Welcome back, ' + data.username + '!', 'success');
                    showLoggedIn(data.username);
                    document.getElementById('loginForm').reset();
                } else if (res.status === 401) {
                    setFieldError(usernameInput);
                    setFieldError(passwordInput);
                    showToast(data.error || 'Invalid username or password.', 'error');
                } else {
                    showToast(data.error || 'Login failed. Please try again.', 'error');
                }
            } catch (err) {
                showToast('Network error: unable to reach the server. Please check your connection.', 'error');
            } finally {
                setLoading(btn, false);
            }
        });

        document.getElementById('loginUsername').addEventListener('input', function() { clearFieldError(this); });
        document.getElementById('loginPassword').addEventListener('input', function() { clearFieldError(this); });

        // ================= Logout =================
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            const btn = document.getElementById('logoutBtn');
            const originalText = btn.textContent;
            btn.textContent = 'Logging out...';
            btn.disabled = true;
            try {
                const res = await fetch('/api/logout', { method: 'POST' });
                if (res.ok) {
                    showLoggedOut();
                    showToast('You have been logged out successfully.', 'info');
                } else {
                    showToast('Logout failed. Please try again.', 'error');
                }
            } catch (err) {
                showToast('Network error during logout. Please try again.', 'error');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // Right Sidebar Toggle
        

        // Check auth on load
        // Right Sidebar Toggle
        const rightToggle = document.getElementById('rightSidebarToggle');
        const rightSidebar = document.getElementById('rightSidebar');
        const rightOverlay = document.getElementById('rightSidebarOverlay');
        function toggleRightSidebar() {
            rightToggle.classList.toggle('active');
            rightSidebar.classList.toggle('active');
            rightOverlay.classList.toggle('active');
        }
        rightToggle.addEventListener('click', toggleRightSidebar);
        rightOverlay.addEventListener('click', toggleRightSidebar);

        // Right Sidebar Tab Switching
        document.querySelectorAll('.right-tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.right-tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.right-tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.rightTab).classList.add('active');
            });
        });

        // Notes Manager
        let notes = [];
        let currentNoteId = null;
        let notesSaveTimeout;
        const notesList = document.getElementById('notesList');
        const noteTitleInput = document.getElementById('noteTitleInput');
        const notesTextarea = document.getElementById('notesTextarea');
        const notesStatus = document.getElementById('notesStatus');
        const newNoteBtn = document.getElementById('newNoteBtn');

        async function loadNotes() {
            try {
                const res = await fetch('/api/notes', { cache: 'no-store' });
                const data = await res.json();
                if (res.ok && data.notes) {
                    notes = data.notes;
                    renderNotesList();
                    if (notes.length > 0 && !currentNoteId) selectNote(notes[0].id);
                } else if (res.status === 401) {
                    notes = [];
                    notesList.innerHTML = '<li class="notes-empty">Log in to create and save notes.</li>';
                    noteTitleInput.disabled = true;
                    notesTextarea.disabled = true;
                    newNoteBtn.disabled = true;
                    notesStatus.innerHTML = '<span class="login-hint">&#9432; Login required for persistent notes</span>';
                } else {
                    notesStatus.textContent = 'Could not load notes.';
                }
            } catch (e) { notesStatus.textContent = 'Network error loading notes.'; }
        }

        function renderNotesList() {
            if (notes.length === 0) {
                notesList.innerHTML = '<li class="notes-empty">No notes yet. Click + New to create one.</li>';
                noteTitleInput.value = '';
                notesTextarea.value = '';
                noteTitleInput.disabled = true;
                notesTextarea.disabled = true;
                currentNoteId = null;
                return;
            }
            notesList.innerHTML = notes.map(n => {
                const isActive = n.id === currentNoteId ? 'active' : '';
                const title = (n.title || 'Untitled').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                return '<li class="' + isActive + '" data-id="' + n.id + '"><span class="note-title">' + title + '</span><button class="note-del" title="Delete">&times;</button></li>';
            }).join('');
            notesList.querySelectorAll('li[data-id]').forEach(li => {
                li.addEventListener('click', (e) => {
                    if (e.target.classList.contains('note-del')) return;
                    selectNote(parseInt(li.dataset.id));
                });
                const delBtn = li.querySelector('.note-del');
                if (delBtn) {
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteNote(parseInt(li.dataset.id));
                    });
                }
            });
        }

        function selectNote(id) {
            currentNoteId = id;
            const note = notes.find(n => n.id === id);
            if (!note) return;
            noteTitleInput.value = note.title || '';
            notesTextarea.value = note.content || '';
            noteTitleInput.disabled = false;
            notesTextarea.disabled = false;
            renderNotesList();
            notesStatus.textContent = '';
        }

        async function saveCurrentNote() {
            if (!currentNoteId) return;
            notesStatus.textContent = 'Saving...';
            clearTimeout(notesSaveTimeout);
            notesSaveTimeout = setTimeout(async () => {
                try {
                    const res = await fetch('/api/notes/' + currentNoteId, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: noteTitleInput.value.trim(), content: notesTextarea.value })
                    });
                    if (res.ok) {
                        const note = notes.find(n => n.id === currentNoteId);
                        if (note) { note.title = noteTitleInput.value.trim(); note.content = notesTextarea.value; }
                        renderNotesList();
                        notesStatus.textContent = 'Saved.';
                        setTimeout(() => { if (notesStatus.textContent === 'Saved.') notesStatus.textContent = ''; }, 2000);
                    } else { notesStatus.textContent = 'Save failed.'; }
                } catch (e) { notesStatus.textContent = 'Network error saving.'; }
            }, 800);
        }

        async function createNewNote() {
            notesStatus.textContent = 'Creating...';
            try {
                const res = await fetch('/api/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: 'New Note', content: '' })
                });
                const data = await res.json();
                if (res.ok) {
                    notes.unshift({ id: data.id, title: data.title, content: '', updated_at: new Date().toISOString() });
                    renderNotesList();
                    selectNote(data.id);
                    notesStatus.textContent = 'Created.';
                    setTimeout(() => notesStatus.textContent = '', 2000);
                } else { notesStatus.textContent = 'Failed to create note.'; }
            } catch (e) { notesStatus.textContent = 'Network error.'; }
        }

        async function deleteNote(id) {
            if (!confirm('Delete this note?')) return;
            try {
                const res = await fetch('/api/notes/' + id, { method: 'DELETE' });
                if (res.ok) {
                    notes = notes.filter(n => n.id !== id);
                    if (currentNoteId === id) {
                        currentNoteId = null;
                        noteTitleInput.value = '';
                        notesTextarea.value = '';
                    }
                    renderNotesList();
                    if (notes.length > 0 && !currentNoteId) selectNote(notes[0].id);
                    notesStatus.textContent = 'Deleted.';
                    setTimeout(() => notesStatus.textContent = '', 2000);
                } else { notesStatus.textContent = 'Delete failed.'; }
            } catch (e) { notesStatus.textContent = 'Network error.'; }
        }

        newNoteBtn.addEventListener('click', createNewNote);
        noteTitleInput.addEventListener('input', saveCurrentNote);
        notesTextarea.addEventListener('input', saveCurrentNote);
        loadNotes();

        // Saved Keys List
        async function loadSavedKeysList() {
            const list = document.getElementById('savedKeysListItems');
            try {
                const res = await fetch('/api/saved-keys');
                const data = await res.json();
                if (res.ok && data.keys && data.keys.length > 0) {
                    list.innerHTML = data.keys.map(k => '<li><span class="key-icon">&#128273;</span> ' + (k.name || 'Unnamed').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</li>').join('');
                } else if (res.status === 401) {
                    list.innerHTML = '<li class="saved-keys-empty">Log in to see your saved keys.</li>';
                } else { list.innerHTML = '<li class="saved-keys-empty">No saved keys yet.</li>'; }
            } catch (e) { list.innerHTML = '<li class="saved-keys-empty">Could not load saved keys.</li>'; }
        }
        loadSavedKeysList();

        checkAuth();
    </script>
</body>
</html>

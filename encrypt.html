<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGP Encryption - Encrypt / Decrypt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Menu Button */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: rgba(157, 78, 221, 0.3);
            border-color: #9d4edd;
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background: #fff;
            margin: 5px 0;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .menu-btn.active span:nth-child(2) { opacity: 0; }
        .menu-btn.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 350px;
            height: 100vh;
            background: rgba(22, 33, 62, 0.98);
            border-right: 1px solid rgba(157, 78, 221, 0.3);
            padding: 80px 30px 30px 30px;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar h2 {
            color: #9d4edd;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(157, 78, 221, 0.3);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #c77dff;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: #9d4edd; border-bottom-color: #9d4edd; }
        .tab-btn:hover { color: #9d4edd; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block;
            color: #c77dff;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #9d4edd;
            background: rgba(157, 78, 221, 0.1);
        }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.3); }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #7b2cbf, #9d4edd);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            background: linear-gradient(90deg, #9d4edd, #c77dff);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
        }

        .message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }
        .message.success { display: block; background: rgba(76, 175, 80, 0.2); color: #81c784; border: 1px solid rgba(76, 175, 80, 0.3); }
        .message.error { display: block; background: rgba(244, 67, 54, 0.2); color: #e57373; border: 1px solid rgba(244, 67, 54, 0.3); }

        .user-info {
            text-align: center;
            padding: 20px;
            background: rgba(157, 78, 221, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(157, 78, 221, 0.3);
        }
        .user-info h3 { color: #9d4edd; margin-bottom: 0.5rem; }
        .user-info p { color: #c77dff; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .logout-btn {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.4);
            color: #e57373;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .logout-btn:hover { background: rgba(244, 67, 54, 0.3); }

        /* Main Content */
        .main-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            text-align: center;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #9d4edd;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .page-header .subtitle {
            margin-top: 0.5rem;
            font-size: 1rem;
            color: #c77dff;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .nav-tab {
            padding: 12px 32px;
            background: rgba(157, 78, 221, 0.15);
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 10px;
            color: #c77dff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .nav-tab:hover {
            background: rgba(157, 78, 221, 0.3);
            border-color: #9d4edd;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3);
        }
        .nav-tab.active {
            background: linear-gradient(90deg, #7b2cbf, #9d4edd);
            border-color: #9d4edd;
            color: #fff;
        }

        /* Encrypt Page Cards */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #9d4edd;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 .icon {
            font-size: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }

        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: all 0.3s ease;
            resize: vertical;
            min-height: 120px;
        }
        .form-group textarea:focus {
            border-color: #9d4edd;
            background: rgba(157, 78, 221, 0.1);
        }
        .form-group textarea::placeholder { color: rgba(255, 255, 255, 0.3); }

        .key-size-select {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }
        .key-size-select option {
            background: #16213e;
            color: #fff;
        }
        .key-size-select:focus { border-color: #9d4edd; }

        .action-btns {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(90deg, #7b2cbf, #9d4edd);
            color: #fff;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #9d4edd, #c77dff);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(157, 78, 221, 0.3);
            color: #c77dff;
        }
        .btn-secondary:hover {
            background: rgba(157, 78, 221, 0.2);
            border-color: #9d4edd;
            color: #fff;
        }
        .btn-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.4);
            color: #81c784;
        }
        .btn-success:hover {
            background: rgba(76, 175, 80, 0.3);
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #c77dff;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 100px;
            display: none;
        }
        .result-box.visible { display: block; }
        .result-box.error { border-color: rgba(244, 67, 54, 0.4); color: #e57373; }
        .result-box.success { border-color: rgba(76, 175, 80, 0.4); color: #81c784; }

        .result-label {
            color: #9d4edd;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            display: none;
        }
        .result-label.visible { display: block; }

        .key-box {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(157, 78, 221, 0.2);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #c77dff;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .key-box.visible { display: block; }

        .server-status {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 2000;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
        }
        .server-status.show { display: block; }
        .server-status.ok {
            background: rgba(76, 175, 80, 0.2);
            color: #81c784;
            border-bottom: 1px solid rgba(76, 175, 80, 0.3);
        }
        .server-status.error {
            background: rgba(244, 67, 54, 0.2);
            color: #e57373;
            border-bottom: 1px solid rgba(244, 67, 54, 0.3);
        }
    </style>
</head>
<body>
    <div class="server-status" id="serverStatus"></div>

    <!-- Menu Button -->
    <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div id="authSection">
            <h2>Account</h2>
            <div class="tabs">
                <button class="tab-btn active" data-tab="register">Register</button>
                <button class="tab-btn" data-tab="login">Login</button>
            </div>
            <div class="tab-content active" id="register">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regUsername">Username</label>
                        <input type="text" id="regUsername" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" placeholder="Enter password" required minlength="6">
                    </div>
                    <button type="submit" class="submit-btn">Create Account</button>
                    <div class="message" id="regMessage"></div>
                </form>
            </div>
            <div class="tab-content" id="login">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                    <div class="message" id="loginMessage"></div>
                </form>
            </div>
        </div>
        <div class="user-info" id="userInfo" style="display: none;">
            <h3>Welcome!</h3>
            <p id="userName">User</p>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <h1>PGP Encryption</h1>
            <div class="subtitle">Encrypt / Decrypt Messages</div>
            <nav class="nav-tabs">
                <a href="/" class="nav-tab">Home</a>
                <a href="/encrypt.html" class="nav-tab active">Encrypt / Decrypt</a>
            </nav>
        </div>

        <!-- Key Generator -->
        <div class="card">
            <h2><span class="icon">&#128273;</span> Key Generator</h2>
            <label style="color: #c77dff; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">RSA Key Size</label>
            <select class="key-size-select" id="genKeySize">
                <option value="4096" selected>RSA 4096 (Recommended)</option>
                <option value="2048">RSA 2048</option>
            </select>
            <div class="action-btns">
                <button class="btn btn-primary" id="generateKeysBtn">Generate Key Pair</button>
                <button class="btn btn-secondary" id="copyPublicBtn" style="display:none;">Copy Public Key</button>
                <button class="btn btn-secondary" id="copyPrivateBtn" style="display:none;">Copy Private Key</button>
            </div>
            <div class="key-box" id="publicKeyBox"></div>
            <div class="key-box" id="privateKeyBox"></div>
        </div>

        <!-- Encrypt -->
        <div class="card">
            <h2><span class="icon">&#128274;</span> Encrypt Message</h2>
            <label style="color: #c77dff; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">RSA Key Size</label>
            <select class="key-size-select" id="encKeySize">
                <option value="4096" selected>RSA 4096</option>
                <option value="2048">RSA 2048</option>
            </select>
            <div class="form-group">
                <label>Recipient Public Key</label>
                <textarea id="encPublicKey" placeholder="Paste PGP public key block here..."></textarea>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="encMessage" placeholder="Type your secret message here..."></textarea>
            </div>
            <div class="action-btns">
                <button class="btn btn-primary" id="encryptBtn">Encrypt</button>
                <button class="btn btn-secondary" id="copyEncryptedBtn" style="display:none;">Copy Result</button>
                <button class="btn btn-success" id="clearEncBtn">Clear</button>
            </div>
            <div class="result-label" id="encResultLabel">Encrypted Message</div>
            <div class="result-box" id="encResult"></div>
        </div>

        <!-- Decrypt -->
        <div class="card">
            <h2><span class="icon">&#128275;</span> Decrypt Message</h2>
            <div class="form-group">
                <label>Your Private Key</label>
                <textarea id="decPrivateKey" placeholder="Paste PGP private key block here..."></textarea>
            </div>
            <div class="form-group">
                <label>Encrypted Message</label>
                <textarea id="decMessage" placeholder="Paste PGP encrypted message block here..."></textarea>
            </div>
            <div class="action-btns">
                <button class="btn btn-primary" id="decryptBtn">Decrypt</button>
                <button class="btn btn-secondary" id="copyDecryptedBtn" style="display:none;">Copy Result</button>
                <button class="btn btn-success" id="clearDecBtn">Clear</button>
            </div>
            <div class="result-label" id="decResultLabel">Decrypted Message</div>
            <div class="result-box" id="decResult"></div>
        </div>
    </div>

    <script>
        // Menu Toggle (same as index)
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            menuBtn.classList.toggle('active');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
        menuBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // Sidebar Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                if (data.logged_in) showLoggedIn(data.username);
            } catch (e) { console.error('Auth check failed:', e); }
        }

        function showLoggedIn(username) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('userName').textContent = username;
        }
        function showLoggedOut() {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('userInfo').style.display = 'none';
        }
        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = 'message ' + (type === 'success' ? 'success' : 'error');
            setTimeout(() => { el.className = 'message'; el.textContent = ''; }, 4000);
        }

        // Auth Forms
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('regUsername').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('regMessage', 'Account created! You can now log in.', 'success');
                    document.getElementById('registerForm').reset();
                    document.querySelector('[data-tab="login"]').click();
                } else {
                    showMessage('regMessage', data.error || 'Registration failed', 'error');
                }
            } catch (e) { showMessage('regMessage', 'Network error', 'error'); }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('loginUsername').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('loginMessage', 'Logged in successfully!', 'success');
                    showLoggedIn(data.username);
                } else {
                    showMessage('loginMessage', data.error || 'Login failed', 'error');
                }
            } catch (e) { showMessage('loginMessage', 'Network error', 'error'); }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/logout', { method: 'POST' });
                if (res.ok) showLoggedOut();
            } catch (e) { console.error('Logout failed:', e); }
        });

        checkAuth();

        // Server status check
        async function checkServerStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const banner = document.getElementById('serverStatus');
                if (res.ok && data.crypto_available) {
                    banner.textContent = 'Server ready — encryption enabled';
                    banner.className = 'server-status show ok';
                    setTimeout(() => { banner.className = 'server-status'; }, 3000);
                } else {
                    banner.textContent = 'Warning: encryption module not available. Please check server logs.';
                    banner.className = 'server-status show error';
                }
            } catch (e) {
                const banner = document.getElementById('serverStatus');
                banner.textContent = 'Warning: unable to reach server. Some features may not work.';
                banner.className = 'server-status show error';
            }
        }
        checkServerStatus();

        // ==================== Encrypt / Decrypt Logic ====================

        function showResult(elementId, labelId, text, type) {
            const el = document.getElementById(elementId);
            const label = document.getElementById(labelId);
            el.textContent = text;
            el.className = 'result-box visible ' + type;
            label.className = 'result-label visible';
        }

        function hideResult(elementId, labelId) {
            document.getElementById(elementId).className = 'result-box';
            document.getElementById(labelId).className = 'result-label';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            }).catch(() => {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('Copied to clipboard!');
            });
        }

        // Generate Keys
        let generatedPublicKey = '';
        let generatedPrivateKey = '';

        document.getElementById('generateKeysBtn').addEventListener('click', async () => {
            const btn = document.getElementById('generateKeysBtn');
            btn.textContent = 'Generating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/generate-keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key_size: parseInt(document.getElementById('genKeySize').value) })
                });
                const data = await res.json();

                if (res.ok) {
                    generatedPublicKey = data.public_key;
                    generatedPrivateKey = data.private_key;

                    const pubBox = document.getElementById('publicKeyBox');
                    const privBox = document.getElementById('privateKeyBox');
                    pubBox.textContent = data.public_key;
                    privBox.textContent = data.private_key;
                    pubBox.classList.add('visible');
                    privBox.classList.add('visible');

                    document.getElementById('copyPublicBtn').style.display = 'inline-block';
                    document.getElementById('copyPrivateBtn').style.display = 'inline-block';

                    // Auto-fill encrypt public key
                    document.getElementById('encPublicKey').value = data.public_key;
                } else {
                    alert(data.error || 'Key generation failed');
                }
            } catch (e) {
                alert('Network error during key generation');
            } finally {
                btn.textContent = 'Generate Key Pair';
                btn.disabled = false;
            }
        });

        document.getElementById('copyPublicBtn').addEventListener('click', () => copyToClipboard(generatedPublicKey));
        document.getElementById('copyPrivateBtn').addEventListener('click', () => copyToClipboard(generatedPrivateKey));

        // Encrypt
        document.getElementById('encryptBtn').addEventListener('click', async () => {
            const publicKey = document.getElementById('encPublicKey').value.trim();
            const message = document.getElementById('encMessage').value;
            const keySize = parseInt(document.getElementById('encKeySize').value);

            if (!publicKey || !message) {
                showResult('encResult', 'encResultLabel', 'Please provide both a public key and a message to encrypt.', 'error');
                return;
            }

            const btn = document.getElementById('encryptBtn');
            btn.textContent = 'Encrypting...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/encrypt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ public_key: publicKey, message: message, key_size: keySize })
                });
                const data = await res.json();

                if (res.ok) {
                    showResult('encResult', 'encResultLabel', data.encrypted, 'success');
                    document.getElementById('copyEncryptedBtn').style.display = 'inline-block';
                } else {
                    showResult('encResult', 'encResultLabel', data.error || 'Encryption failed', 'error');
                }
            } catch (e) {
                showResult('encResult', 'encResultLabel', 'Network error during encryption', 'error');
            } finally {
                btn.textContent = 'Encrypt';
                btn.disabled = false;
            }
        });

        document.getElementById('copyEncryptedBtn').addEventListener('click', () => {
            copyToClipboard(document.getElementById('encResult').textContent);
        });

        document.getElementById('clearEncBtn').addEventListener('click', () => {
            document.getElementById('encPublicKey').value = '';
            document.getElementById('encMessage').value = '';
            hideResult('encResult', 'encResultLabel');
            document.getElementById('copyEncryptedBtn').style.display = 'none';
        });

        // Decrypt
        document.getElementById('decryptBtn').addEventListener('click', async () => {
            const privateKey = document.getElementById('decPrivateKey').value.trim();
            const encryptedMessage = document.getElementById('decMessage').value.trim();

            if (!privateKey || !encryptedMessage) {
                showResult('decResult', 'decResultLabel', 'Please provide both a private key and an encrypted message.', 'error');
                return;
            }

            const btn = document.getElementById('decryptBtn');
            btn.textContent = 'Decrypting...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/decrypt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ private_key: privateKey, encrypted_message: encryptedMessage })
                });
                const data = await res.json();

                if (res.ok) {
                    showResult('decResult', 'decResultLabel', data.decrypted, 'success');
                    document.getElementById('copyDecryptedBtn').style.display = 'inline-block';
                } else {
                    showResult('decResult', 'decResultLabel', data.error || 'Decryption failed', 'error');
                }
            } catch (e) {
                showResult('decResult', 'decResultLabel', 'Network error during decryption', 'error');
            } finally {
                btn.textContent = 'Decrypt';
                btn.disabled = false;
            }
        });

        document.getElementById('copyDecryptedBtn').addEventListener('click', () => {
            copyToClipboard(document.getElementById('decResult').textContent);
        });

        document.getElementById('clearDecBtn').addEventListener('click', () => {
            document.getElementById('decPrivateKey').value = '';
            document.getElementById('decMessage').value = '';
            hideResult('decResult', 'decResultLabel');
            document.getElementById('copyDecryptedBtn').style.display = 'none';
        });
    </script>
</body>
</html>
